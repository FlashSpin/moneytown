# The Merchant guild: after the US close on weekdays, fetch every fund's daily
# prices, breed and judge fund strategies against 60/40, and post the prices
# and verdict to the app, which steps the paper ISA (/isa). Pushes to the
# merchant's own files run it without posting, to try changes on real data.
name: Merchant guild

on:
  schedule:
    - cron: "15 22 * * 1-5"
  workflow_dispatch:
    inputs:
      post:
        description: "Post to the app (1 = yes)"
        default: "1"
  push:
    branches: [claude/working-properly-b4rxyz]
    paths:
      - src/game/merchant.ts
      - scripts/merchant-lab.ts
      - .github/workflows/merchant.yml

permissions:
  contents: read

concurrency:
  group: merchant
  cancel-in-progress: false

jobs:
  merchant:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prices, lab and the paper ISA
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://moneytown.vercel.app' }}
          POST_RESULTS: ${{ github.ref == 'refs/heads/main' && github.event_name != 'push' && (inputs.post || '1') || '0' }}
        run: node --experimental-strip-types scripts/merchant-lab.ts
