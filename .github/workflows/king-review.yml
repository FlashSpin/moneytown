# Every 4 hours, ask the King to review the parish's trades: /api/review
# re-marks each villager's position at live prices and gives new orders.
# Free on GitHub Actions. Needs the repository secret CRON_SECRET — the same
# value as CRON_SECRET in Vercel. Set SITE_URL as a repository variable if the
# site isn't at https://moneytown.vercel.app.
name: King's trading review

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the King to review the parish
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://moneytown.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Add the CRON_SECRET repository secret (same value as in Vercel)."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/review"
